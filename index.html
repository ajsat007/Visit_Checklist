<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Smart Services - Tour Visit Checklist System">
<meta name="theme-color" content="#1E315C">
<title>Smart Services | लॉगिन</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/images/icon-32.png">
<link rel="apple-touch-icon" href="assets/images/icon-180.png">

<!-- Apply saved theme before paint to avoid a flash of the wrong mode -->
<script>
  if (localStorage.getItem('ss_theme') === 'dark') document.documentElement.classList.add('dark');
</script>

<style>
  :root {
    --navy: #1E315C;
    --navy-deep: #101d38;
    --yellow: #F4B400;
    --bg: #F8FAFC;
  }
  * { font-family: 'Noto Sans Devanagari', sans-serif; }

  body {
    min-height: 100vh;
    margin: 0;
    background: radial-gradient(circle at 15% 15%, #2a4074 0%, var(--navy) 45%, var(--navy-deep) 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: background 0.4s ease;
  }
  html.dark body {
    background: radial-gradient(circle at 15% 15%, #16233f 0%, #0b1327 45%, #05070f 100%);
  }

  /* Oversized, softly blurred brand mark ghosted into the backdrop — the
     page's one signature element, tying the glass surface directly back
     to the logo instead of a generic gradient blob. */
  .brand-ghost {
    position: absolute; top: -10%; right: -12%;
    width: min(70vw, 720px); opacity: 0.16; filter: blur(2px);
    pointer-events: none; transform: rotate(-6deg);
  }

  .glass {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .field-label {
    color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600;
    margin-bottom: 6px; display: block;
  }
  .glass-input {
    width: 100%; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.22); border-radius: 12px;
    padding: 13px 16px; color: #fff; font-size: 16px;
    transition: all 0.25s ease;
  }
  .glass-input::placeholder { color: rgba(255,255,255,0.45); }
  .glass-input:focus {
    outline: none; background: rgba(255,255,255,0.14);
    border-color: var(--yellow);
    box-shadow: 0 0 0 3px rgba(244,180,0,0.18);
  }

  .btn-primary {
    width: 100%; background: var(--yellow); color: var(--navy-deep);
    border: none; padding: 14px; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(244,180,0,0.35); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .theme-toggle {
    position: fixed; top: 18px; right: 18px; z-index: 20;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    color: #fff;
  }

  .error-message { color: #fca5a5; font-size: 13.5px; margin-top: 10px; display: none; }
  .error-message.show { display: block; }

  .spinner {
    width: 18px; height: 18px; border: 2.5px solid rgba(30,49,92,0.3);
    border-top-color: var(--navy-deep); border-radius: 50%;
    display: none; animation: spin 0.8s linear infinite;
  }
  .spinner.show { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .animate-fade-in { animation: fadeIn 0.7s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(16px);} to { opacity:1; transform:none; } }
</style>
</head>
<body>

<img src="assets/images/logo-icon.png" alt="" class="brand-ghost" aria-hidden="true">

<button class="theme-toggle" id="themeToggle" type="button" aria-label="थीम बदला">
  <svg id="themeIconLight" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
  <svg id="themeIconDark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
</button>

<div class="w-full max-w-md animate-fade-in" style="position:relative;z-index:10;">
  <div class="text-center mb-7">
    <div style="display:inline-block;background:rgba(255,255,255,0.95);border-radius:18px;padding:16px 24px;box-shadow:0 12px 32px rgba(0,0,0,0.25);">
      <img src="assets/images/logo-full.png" alt="Smart Services" style="max-width:240px;width:100%;">
    </div>
    <h1 class="text-white text-2xl font-bold mt-4">टूर व्हिजिट चेकलिस्ट</h1>
    <p class="text-white text-opacity-70 text-sm">व्यवस्थापन प्रणाली</p>
  </div>

  <div class="glass p-8">
    <form id="loginForm" autocomplete="on">
      <div class="mb-5">
        <label class="field-label" for="employeeId">कर्मचारी आयडी</label>
        <input type="text" id="employeeId" class="glass-input" placeholder="उदा. EMP001" required autocomplete="username">
      </div>

      <div id="errorMessage" class="error-message"><span id="errorText"></span></div>

      <button type="submit" class="btn-primary mt-6" id="loginBtn">
        <span id="btnText">लॉगिन करा</span>
        <div class="spinner" id="loadingSpinner"></div>
      </button>
    </form>
  </div>

  <div class="text-center mt-7">
    <p class="text-white text-opacity-60 text-xs">© 2026 Smart Services — Leave it to us</p>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  const themeToggle = document.getElementById('themeToggle');
  const lightIcon = document.getElementById('themeIconLight');
  const darkIcon = document.getElementById('themeIconDark');
  function syncThemeIcons() {
    const isDark = document.documentElement.classList.contains('dark');
    lightIcon.classList.toggle('hidden', isDark);
    darkIcon.classList.toggle('hidden', !isDark);
  }
  syncThemeIcons();
  themeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('ss_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    syncThemeIcons();
  });
</script>

<script type="module">
  import { login } from './assets/js/api.js';
  import { setSession } from './assets/js/auth.js';
  import { isAuthenticated } from './assets/js/auth.js';

  // Already logged in? Skip straight past the login screen.
  if (isAuthenticated()) {
    window.location.href = 'visit.html';
  }

  const form = document.getElementById('loginForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const employeeId = document.getElementById('employeeId').value.trim();

    if (!employeeId) {
      showError('कर्मचारी आयडी भरा');
      return;
    }

    setLoading(true);
    try {
      const response = await login(employeeId);
      if (response.success) {
        setSession(response.token, response.user);
        await Swal.fire({
          icon: 'success', title: 'स्वागतम', text: response.user.name,
          timer: 1300, showConfirmButton: false
        });
        window.location.href = response.user.role === 'Admin' ? 'dashboard.html' : 'visit.html';
      } else {
        showError(response.message || 'लॉगिन अयशस्वी');
      }
    } catch (error) {
      showError('त्रुटी: ' + error.message);
    } finally {
      setLoading(false);
    }
  });

  function setLoading(loading) {
    document.getElementById('loginBtn').disabled = loading;
    document.getElementById('loadingSpinner').classList.toggle('show', loading);
    document.getElementById('btnText').textContent = loading ? 'लॉगिन होत आहे...' : 'लॉगिन करा';
  }

  function showError(message) {
    const box = document.getElementById('errorMessage');
    document.getElementById('errorText').textContent = message;
    box.classList.add('show');
    setTimeout(() => box.classList.remove('show'), 5000);
  }
</script>
</body>
</html>
