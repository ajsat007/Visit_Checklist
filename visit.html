<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E315C">
<title>Smart Services | टूर व्हिजिट</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/images/icon-32.png">
<link rel="apple-touch-icon" href="assets/images/icon-180.png">
<script>if (localStorage.getItem('ss_theme') === 'dark') document.documentElement.classList.add('dark');</script>

<style>
  :root { --navy:#1E315C; --navy-deep:#101d38; --yellow:#F4B400; --bg:#F8FAFC; }
  * { font-family:'Noto Sans Devanagari', sans-serif; }
  body { margin:0; background:var(--bg); color:#1a1a1a; padding-bottom:40px; transition:background .3s; }
  html.dark body { background:#0b1120; color:#e5e9f2; }

  .header {
    background:var(--navy); color:#fff; position:sticky; top:0; z-index:30;
    box-shadow:0 4px 18px rgba(0,0,0,0.18);
  }
  .card {
    background:#fff; border-radius:16px; padding:20px;
    box-shadow:0 2px 14px rgba(15,23,42,0.06); border:1px solid #eef1f6;
    margin-bottom:16px;
  }
  html.dark .card { background:#131c30; border-color:#1e293b; }

  .section-title { font-weight:700; color:var(--navy); font-size:16px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  html.dark .section-title { color:#f4c430; }

  .field-label { font-size:12.5px; font-weight:600; color:#64748b; display:block; margin-bottom:5px; }
  html.dark .field-label { color:#94a3b8; }

  .input {
    width:100%; border:1.5px solid #e2e8f0; border-radius:10px; padding:11px 14px;
    font-size:15px; background:#fff; transition:border-color .2s; color:#111;
  }
  html.dark .input { background:#0f172a; border-color:#26314a; color:#e5e9f2; }
  .input:focus { outline:none; border-color:var(--navy); }
  .input:disabled, .input[readonly] { background:#f1f5f9; color:#64748b; }
  html.dark .input:disabled, html.dark .input[readonly] { background:#1a2333; color:#93a1b8; }

  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; }

  .yn-group { display:flex; gap:8px; }
  .yn-btn {
    flex:1; padding:10px 0; border-radius:10px; border:1.5px solid #e2e8f0;
    background:#fff; font-weight:700; cursor:pointer; font-size:14px; transition:all .15s;
  }
  html.dark .yn-btn { background:#0f172a; border-color:#26314a; color:#cbd5e1; }
  .yn-btn.yes.active { background:#16a34a; border-color:#16a34a; color:#fff; }
  .yn-btn.no.active { background:#dc2626; border-color:#dc2626; color:#fff; }

  .btn-primary {
    background:var(--yellow); color:var(--navy-deep); border:none; padding:14px 20px;
    border-radius:12px; font-weight:700; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    transition:transform .15s;
  }
  .btn-primary:hover:not(:disabled) { transform:translateY(-1px); }
  .btn-primary:disabled { opacity:0.55; cursor:not-allowed; }

  .btn-secondary {
    background:var(--navy); color:#fff; border:none; padding:13px 20px;
    border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; width:100%;
  }

  .gps-status { font-size:13px; padding:10px 12px; border-radius:10px; background:#f1f5f9; color:#475569; }
  html.dark .gps-status { background:#131c30; color:#94a3b8; }
  .gps-status.ok { background:#ecfdf5; color:#047857; }
  .gps-status.err { background:#fef2f2; color:#b91c1c; }

  .progress-track { height:7px; background:#e2e8f0; border-radius:99px; overflow:hidden; }
  html.dark .progress-track { background:#1e293b; }
  .progress-fill { height:100%; background:var(--yellow); transition:width .3s; width:0%; }

  .category-header {
    background:var(--navy); color:#fff; padding:9px 14px; border-radius:10px;
    font-weight:700; font-size:14px; margin-bottom:10px;
  }

  .hidden-force { display:none !important; }

  /* 5-star rating widget — shown under a "तपासावी/तपासाव्यात" question once होय is selected */
  .star-group { display:flex; gap:4px; margin-top:10px; }
  .star-btn {
    background:none; border:none; cursor:pointer; padding:0; line-height:1;
    font-size:28px; color:#e2e8f0; transition:color .15s, transform .1s;
  }
  .star-btn:hover { transform:scale(1.08); }
  .star-btn.filled { color:var(--yellow); }
  html.dark .star-btn { color:#334155; }
  html.dark .star-btn.filled { color:var(--yellow); }
  .rating-hint { font-size:12px; color:#94a3b8; margin-top:4px; }
  .rating-hint.required { color:#b91c1c; }

  /* Multi-select checkbox group — used for the "अडचणी असल्यास खालील पर्याय टिक करावा" question */
  .check-group { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .check-option {
    display:flex; align-items:center; gap:9px; padding:9px 12px; border-radius:10px;
    border:1.5px solid #e2e8f0; background:#fff; cursor:pointer; font-size:13.5px; color:#1e293b;
  }
  html.dark .check-option { background:#0f172a; border-color:#26314a; color:#e5e9f2; }
  .check-option input[type="checkbox"] { width:16px; height:16px; accent-color:var(--navy); flex-shrink:0; }
</style>
</head>
<body>

<div class="header">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="assets/images/logo-icon.png" alt="" style="width:34px;height:34px;">
      <div>
        <div class="font-bold text-sm leading-tight">Smart Services</div>
        <div class="text-xs opacity-70 leading-tight">टूर व्हिजिट चेकलिस्ट</div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs opacity-80 hidden sm:inline" id="sessionTime"></span>
      <a href="dashboard.html" id="dashboardLink" class="text-xs font-semibold rounded-lg px-3 py-2 hidden-force" style="background:rgba(255,255,255,0.12);color:#fff;text-decoration:none;">डॅशबोर्ड</a>
      <button id="themeToggle" type="button" class="rounded-full p-2" style="background:rgba(255,255,255,0.12);" aria-label="थीम">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
      <button id="logoutBtn" type="button" class="text-xs font-semibold rounded-lg px-3 py-2" style="background:rgba(255,255,255,0.12);">बाहेर पडा</button>
    </div>
  </div>
</div>

<div class="max-w-3xl mx-auto px-4 pt-5">

  <!-- Officer Info (auto-filled, read-only) -->
  <div class="card">
    <div class="section-title">👤 अधिकारी माहिती</div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="field-label">कर्मचारी आयडी</label><input class="input" id="infoEmployeeId" readonly></div>
      <div><label class="field-label">नाव</label><input class="input" id="infoName" readonly></div>
      <div><label class="field-label">पदनाम</label><input class="input" id="infoDesignation" readonly></div>
      <div><label class="field-label">जिल्हा</label><input class="input" id="infoDistrict" readonly></div>
    </div>
  </div>

  <form id="visitForm">
    <!-- Visit Details -->
    <div class="card">
      <div class="section-title">📍 भेट तपशील</div>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="field-label">जिल्हा *</label>
          <select class="input" id="district" required></select>
        </div>
        <div>
          <label class="field-label">बस स्टेशन *</label>
          <select class="input" id="busStation" required disabled>
            <option value="">आधी जिल्हा निवडा</option>
          </select>
        </div>
        <div>
          <label class="field-label">भेट दिनांक *</label>
          <input type="date" class="input" id="visitDate" required>
        </div>
        <!-- Visit Time is still captured and submitted, just not shown on screen -->
        <input type="hidden" id="visitTime">
      </div>
      <!-- GPS is still captured and submitted, just not shown on screen -->
      <div id="gpsStatus" class="hidden-force"></div>
    </div>

    <!-- Checklist -->
    <div id="checklistContainer">
      <div class="card text-center text-sm" style="color:#94a3b8;">चेकलिस्ट लोड होत आहे...</div>
    </div>

    <!-- Overall Remark -->
    <div class="card">
      <div class="section-title">📝 एकूण शेरा</div>
      <textarea class="input" id="overallRemark" rows="3" placeholder="काही टिप्पणी असल्यास येथे लिहा..."></textarea>
    </div>

    <!-- Progress + Submit -->
    <div class="card">
      <div class="flex items-center justify-between text-xs font-semibold mb-2" style="color:#64748b;">
        <span>प्रगती</span>
        <span id="progressText">0/0</span>
      </div>
      <div class="progress-track mb-4"><div class="progress-fill" id="progressFill"></div></div>
      <button type="submit" class="btn-primary" id="submitBtn">
        <span id="submitBtnText">सबमिट करा</span>
      </button>
    </div>
  </form>

  <!-- Post-submit result panel -->
  <div class="card hidden-force" id="resultPanel">
    <div class="text-center mb-4">
      <div style="font-size:38px;">✅</div>
      <div class="font-bold text-lg" style="color:var(--navy);">भेट यशस्वीरित्या जतन झाली</div>
      <div class="text-sm mt-1" id="resultSubtext" style="color:#64748b;"></div>
      <div class="text-xs mt-2" style="color:#94a3b8;">Visit ID: <span id="resultVisitId" class="font-mono"></span></div>
    </div>

    <div class="grid grid-cols-1 gap-3 mb-4">
      <a id="downloadPdfBtn" href="#" target="_blank" class="btn-secondary text-center" style="text-decoration:none;">📄 PDF डाउनलोड करा</a>
      <button type="button" id="retryPdfBtn" class="btn-secondary hidden-force" style="background:#64748b;">🔄 PDF पुन्हा तयार करा</button>
    </div>

    <div class="border-t pt-4" style="border-color:#e2e8f0;">
      <div class="section-title" style="margin-bottom:8px;">📤 सही केलेली चेकलिस्ट अपलोड करा</div>
      <p class="text-xs mb-3" style="color:#94a3b8;">PDF डाउनलोड करा → प्रिंट घ्या → सही व शिक्का घ्या → स्कॅन/फोटो अपलोड करा (PDF/JPG/PNG)</p>
      <input type="file" id="signedFileInput" accept=".pdf,.jpg,.jpeg,.png" class="input mb-3">
      <button type="button" id="uploadSignedBtn" class="btn-primary">अपलोड करा</button>
      <div id="uploadStatus" class="text-xs mt-2"></div>
    </div>

    <button type="button" id="newVisitBtn" class="btn-secondary mt-4">➕ नवीन भेट सुरू करा</button>
  </div>

</div>

<script>
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('ss_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>

<script type="module">
  import { requireAuth, getUser, getFormattedRemainingTime, logoutAndRedirect } from './assets/js/auth.js';
  import { getDistricts, getBusStations, getChecklist, submitVisit, uploadSignedChecklist, regeneratePDF } from './assets/js/api.js';
  import { escapeHtml, getCurrentPosition, reverseGeocode, fileToBase64, validateSignedChecklistFile, formatDateTime, formatTime } from './assets/js/utils.js';

  if (!requireAuth()) { throw new Error('redirecting'); }

  const user = getUser();
  let checklistQuestions = []; // flat list [{questionId, category, question}]
  let currentAnswers = {};     // questionId -> 'होय' | 'नाही'
  let gpsData = null;
  let lastVisitId = null;

  init();

  async function init() {
    fillOfficerInfo();
    setupClock();
    setupLogout();
    await Promise.all([loadDistricts(), loadChecklist()]);
    captureGps();
    document.getElementById('district').addEventListener('change', onDistrictChange);
    document.getElementById('visitForm').addEventListener('submit', onSubmit);
    document.getElementById('newVisitBtn').addEventListener('click', resetForNewVisit);
    document.getElementById('uploadSignedBtn').addEventListener('click', onUploadSigned);
    document.getElementById('retryPdfBtn').addEventListener('click', onRetryPdf);
  }

  function fillOfficerInfo() {
    document.getElementById('infoEmployeeId').value = user.employeeId || '';
    document.getElementById('infoName').value = user.name || '';
    document.getElementById('infoDesignation').value = user.designation || '';
    document.getElementById('infoDistrict').value = user.district || '—';
    if (user.role === 'Admin') {
      document.getElementById('dashboardLink').classList.remove('hidden-force');
    }
  }

  function setupClock() {
    const dateInput = document.getElementById('visitDate');
    const todayStr = formatDateTime(new Date());
    dateInput.max = todayStr; // no future-dated visits
    dateInput.value = todayStr; // sensible default — editable from here, user can pick any past date

    const tick = () => {
      document.getElementById('visitTime').value = formatTime(new Date());
      document.getElementById('sessionTime').textContent = 'सत्र: ' + getFormattedRemainingTime();
    };
    tick();
    setInterval(tick, 1000);
  }

  function setupLogout() {
    document.getElementById('logoutBtn').addEventListener('click', () => {
      Swal.fire({
        title: 'बाहेर पडायचे आहे का?', icon: 'question', showCancelButton: true,
        confirmButtonText: 'होय', cancelButtonText: 'रद्द करा'
      }).then((r) => { if (r.isConfirmed) logoutAndRedirect(); });
    });
  }

  async function loadDistricts() {
    const response = await getDistricts();
    const select = document.getElementById('district');
    select.innerHTML = '<option value="">जिल्हा निवडा</option>';
    if (response.success) {
      response.data.forEach((d) => {
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = d;
        select.appendChild(opt);
      });
      // Pre-select the officer's assigned district, if any, as a convenience default
      if (user.district && response.data.includes(user.district)) {
        select.value = user.district;
        onDistrictChange();
      }
    }
  }

  async function onDistrictChange() {
    const district = document.getElementById('district').value;
    const stationSelect = document.getElementById('busStation');
    stationSelect.innerHTML = '<option value="">लोड होत आहे...</option>';
    stationSelect.disabled = true;
    if (!district) {
      stationSelect.innerHTML = '<option value="">आधी जिल्हा निवडा</option>';
      return;
    }
    const response = await getBusStations(district);
    stationSelect.innerHTML = '<option value="">बस स्टेशन निवडा</option>';
    if (response.success) {
      response.data.forEach((s) => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        stationSelect.appendChild(opt);
      });
    }
    stationSelect.disabled = false;
  }

  // Questions containing either of these words require a 5-star rating
  // (shown once होय is selected) in addition to the होय/नाही answer.
  const RATING_KEYWORDS = ['तपासावी', 'तपासाव्यात', 'तपासावे', 'असल्यास खालील रेट'];
  function isRatingQuestion(questionText) {
    return RATING_KEYWORDS.some((kw) => (questionText || '').indexOf(kw) !== -1);
  }

  // The "कर्मचाऱ्यांच्या अडचणी" question has NO होय/नाही — only a multi-select
  // checkbox group of difficulty categories. The last option is always
  // "इतर" (Other); ticking it reveals a required free-text box. The first
  // three labels are placeholders — update DIFFICULTY_OPTIONS below with
  // the final option text whenever it's ready; no other code changes.
  const DIFFICULTY_KEYWORD = 'अडचणी असल्यास खालील पर्याय टिक करावा';
  function isDifficultyQuestion(questionText) {
    return (questionText || '').indexOf(DIFFICULTY_KEYWORD) !== -1;
  }
  const DIFFICULTY_OTHER_LABEL = 'इतर';
  const DIFFICULTY_OPTIONS = [
    'पर्याय १ — (अपडेट प्रलंबित)',
    'पर्याय २ — (अपडेट प्रलंबित)',
    'पर्याय ३ — (अपडेट प्रलंबित)',
    DIFFICULTY_OTHER_LABEL
  ];

  // Questions where selecting होय opens a required textbox for details.
  const YES_NOTE_KEYWORDS = [
    'ड्रेनेज, पाणीपुरवठा, विद्युत किंवा इतर कोणत्याही तांत्रिक समस्या असल्यास त्याची नोंद घ्यावी', // Q012 — drainage/water/electricity technical issue
    'कर्मचाऱ्यानी भरतीसाठी कुठल्याही प्रकारची देवाण घेवाण केल्याचे आढळून आले आहे का' // Q005 — recruitment "देवाण घेवाण" found
  ];
  function isYesNoteQuestion(questionText) {
    return YES_NOTE_KEYWORDS.some((kw) => (questionText || '').indexOf(kw) !== -1);
  }

  async function loadChecklist() {
    const response = await getChecklist();
    const container = document.getElementById('checklistContainer');
    container.innerHTML = '';

    if (!response.success || !response.data.categories.length) {
      container.innerHTML = '<div class="card text-center text-sm" style="color:#94a3b8;">चेकलिस्ट उपलब्ध नाही</div>';
      return;
    }

    checklistQuestions = [];
    response.data.categories.forEach((category) => {
      const card = document.createElement('div');
      card.className = 'card';

      const header = document.createElement('div');
      header.className = 'category-header';
      header.textContent = category; // textContent — never innerHTML — for sheet-sourced text
      card.appendChild(header);

      const list = document.createElement('div');
      list.className = 'space-y-3';

      response.data.questions[category].forEach((q) => {
        const rating = isRatingQuestion(q.question);
        const difficulty = isDifficultyQuestion(q.question);
        const yesNote = isYesNoteQuestion(q.question);
        checklistQuestions.push(q);

        const row = document.createElement('div');
        row.style.cssText = 'padding:10px 0;border-bottom:1px solid #f1f5f9;';
        row.dataset.questionId = q.questionId;

        const questionText = document.createElement('div');
        questionText.className = 'text-sm mb-2';
        questionText.style.cssText = 'color:#1e293b;';
        questionText.textContent = q.question; // safe text insertion
        row.appendChild(questionText);

        if (difficulty) {
          // No होय/नाही for this question — only the checkbox group.
          const checkGroup = document.createElement('div');
          checkGroup.className = 'check-group';

          DIFFICULTY_OPTIONS.forEach((label) => {
            const optLabel = document.createElement('label');
            optLabel.className = 'check-option';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = label;

            // Only the "इतर" checkbox gets an attached free-text box.
            let otherBox = null;
            if (label === DIFFICULTY_OTHER_LABEL) {
              otherBox = document.createElement('textarea');
              otherBox.className = 'input hidden-force mt-2';
              otherBox.rows = 2;
              otherBox.style.fontSize = '13px';
              otherBox.placeholder = 'तपशील लिहा... (आवश्यक)';
              otherBox.addEventListener('input', () => {
                if (!currentAnswers[q.questionId]) currentAnswers[q.questionId] = {};
                currentAnswers[q.questionId].otherText = otherBox.value;
                updateProgress();
              });
            }

            cb.addEventListener('change', () => {
              if (!currentAnswers[q.questionId]) currentAnswers[q.questionId] = {};
              const current = currentAnswers[q.questionId].difficultyOptions || [];
              currentAnswers[q.questionId].difficultyOptions = cb.checked
                ? [...current, label]
                : current.filter((v) => v !== label);
              if (otherBox) {
                if (cb.checked) {
                  otherBox.classList.remove('hidden-force');
                } else {
                  otherBox.classList.add('hidden-force');
                  otherBox.value = '';
                  currentAnswers[q.questionId].otherText = '';
                }
              }
              updateProgress();
            });

            const span = document.createElement('span');
            span.textContent = label; // textContent — safe even after Aj updates the labels
            optLabel.appendChild(cb);
            optLabel.appendChild(span);
            checkGroup.appendChild(optLabel);
            if (otherBox) checkGroup.appendChild(otherBox);
          });

          row.appendChild(checkGroup);
          list.appendChild(row);
          return; // difficulty question is fully built — skip the normal yn branch below
        }

        // ---- Normal होय/नाही question (optionally layered with a 5-star
        // rating and/or a required "note on होय" textbox) ----
        const ynGroup = document.createElement('div');
        ynGroup.className = 'yn-group';

        const yesBtn = document.createElement('button');
        yesBtn.type = 'button'; yesBtn.className = 'yn-btn yes'; yesBtn.textContent = '✅ होय';
        const noBtn = document.createElement('button');
        noBtn.type = 'button'; noBtn.className = 'yn-btn no'; noBtn.textContent = '❌ नाही';

        // Required whenever नाही is selected — hidden otherwise. Selecting
        // होय clears and hides it again, since a remark only makes sense
        // attached to a "no" answer.
        const remarkBox = document.createElement('textarea');
        remarkBox.className = 'input hidden-force mt-2';
        remarkBox.rows = 2;
        remarkBox.style.fontSize = '13px';
        remarkBox.placeholder = 'कारण लिहा... (आवश्यक)';
        remarkBox.addEventListener('input', () => {
          if (currentAnswers[q.questionId]) currentAnswers[q.questionId].remark = remarkBox.value;
          updateProgress();
        });

        // 5-star rating — only built for तपासावी/तपासाव्यात/तपासावे questions.
        // Hidden until होय is selected; required once shown.
        let starGroup = null;
        let starButtons = [];
        let ratingHint = null;
        if (rating) {
          starGroup = document.createElement('div');
          starGroup.className = 'star-group hidden-force';
          for (let i = 1; i <= 5; i++) {
            const starBtn = document.createElement('button');
            starBtn.type = 'button';
            starBtn.className = 'star-btn';
            starBtn.textContent = '★';
            starBtn.dataset.value = String(i);
            starBtn.setAttribute('aria-label', i + ' स्टार');
            starBtn.addEventListener('click', () => setRating(q.questionId, i, starButtons, ratingHint));
            starButtons.push(starBtn);
            starGroup.appendChild(starBtn);
          }
          ratingHint = document.createElement('div');
          ratingHint.className = 'rating-hint required';
          ratingHint.textContent = 'रेटिंग द्या (आवश्यक)';
        }

        // "Note on होय" — required textbox, opposite polarity of remarkBox.
        // Only built for the drainage/technical-issue question.
        let yesNoteBox = null;
        if (yesNote) {
          yesNoteBox = document.createElement('textarea');
          yesNoteBox.className = 'input hidden-force mt-2';
          yesNoteBox.rows = 2;
          yesNoteBox.style.fontSize = '13px';
          yesNoteBox.placeholder = 'तपशील लिहा... (आवश्यक)';
          yesNoteBox.addEventListener('input', () => {
            if (currentAnswers[q.questionId]) currentAnswers[q.questionId].yesNote = yesNoteBox.value;
            updateProgress();
          });
        }

        yesBtn.addEventListener('click', () => selectAnswer(q.questionId, 'होय', yesBtn, noBtn, remarkBox, starGroup, starButtons, ratingHint, yesNoteBox));
        noBtn.addEventListener('click', () => selectAnswer(q.questionId, 'नाही', noBtn, yesBtn, remarkBox, starGroup, starButtons, ratingHint, yesNoteBox));

        ynGroup.appendChild(yesBtn);
        ynGroup.appendChild(noBtn);
        row.appendChild(ynGroup);
        row.appendChild(remarkBox);
        if (starGroup) { row.appendChild(starGroup); row.appendChild(ratingHint); }
        if (yesNoteBox) row.appendChild(yesNoteBox);
        list.appendChild(row);
      });

      card.appendChild(list);
      container.appendChild(card);
    });

    updateProgress();
  }

  function setRating(questionId, value, starButtons, ratingHint) {
    if (!currentAnswers[questionId]) currentAnswers[questionId] = {};
    currentAnswers[questionId].rating = value;
    starButtons.forEach((btn, idx) => btn.classList.toggle('filled', idx < value));
    if (ratingHint) { ratingHint.textContent = value + ' / 5'; ratingHint.classList.remove('required'); }
    updateProgress();
  }

  function selectAnswer(questionId, value, activeBtn, otherBtn, remarkBox, starGroup, starButtons, ratingHint, yesNoteBox) {
    if (!currentAnswers[questionId]) currentAnswers[questionId] = {};
    currentAnswers[questionId].answer = value;
    activeBtn.classList.add('active');
    otherBtn.classList.remove('active');

    if (value === 'नाही') {
      remarkBox.classList.remove('hidden-force');
    } else {
      remarkBox.classList.add('hidden-force');
      remarkBox.value = '';
      currentAnswers[questionId].remark = '';
    }

    // Star rating only ever applies to होय — reset/hide it whenever नाही
    // is chosen so a stale rating can't be submitted for a "no" answer.
    if (starGroup) {
      if (value === 'होय') {
        starGroup.classList.remove('hidden-force');
        if (ratingHint) ratingHint.classList.remove('hidden-force');
      } else {
        starGroup.classList.add('hidden-force');
        if (ratingHint) ratingHint.classList.add('hidden-force');
        starButtons.forEach((btn) => btn.classList.remove('filled'));
        delete currentAnswers[questionId].rating;
      }
    }

    // "Note on होय" textbox — opposite polarity of remarkBox: shown and
    // required on होय, hidden and cleared on नाही.
    if (yesNoteBox) {
      if (value === 'होय') {
        yesNoteBox.classList.remove('hidden-force');
      } else {
        yesNoteBox.classList.add('hidden-force');
        yesNoteBox.value = '';
        currentAnswers[questionId].yesNote = '';
      }
    }
    updateProgress();
  }

  // A question counts as "answered" once it has a real answer, and — if
  // that answer is नाही — a non-empty remark too. A rating question also
  // requires a 1-5 star rating once होय is selected, and a "note on होय"
  // question requires its textbox filled once होय is selected. The
  // difficulty checkbox question has no answer at all — it's optional,
  // except its "इतर" detail box is required once इतर is ticked. Shared by
  // both the progress bar and the submit-time validation so they never
  // disagree.
  function isQuestionAnswered(questionId) {
    const q = checklistQuestions.find((qq) => qq.questionId === questionId);
    const a = currentAnswers[questionId];

    if (q && isDifficultyQuestion(q.question)) {
      if (a && (a.difficultyOptions || []).indexOf(DIFFICULTY_OTHER_LABEL) !== -1) {
        return !!(a.otherText && a.otherText.trim());
      }
      return true;
    }

    if (!a || !a.answer) return false;
    if (a.answer === 'नाही') return !!(a.remark && a.remark.trim());
    if (q && isRatingQuestion(q.question) && !a.rating) return false;
    if (q && isYesNoteQuestion(q.question) && !(a.yesNote && a.yesNote.trim())) return false;
    return true;
  }

  function updateProgress() {
    const total = checklistQuestions.length;
    const answered = checklistQuestions.filter((q) => isQuestionAnswered(q.questionId)).length;
    document.getElementById('progressText').textContent = `${answered}/${total}`;
    document.getElementById('progressFill').style.width = total ? `${(answered / total) * 100}%` : '0%';
  }

  async function captureGps() {
    const statusEl = document.getElementById('gpsStatus');
    statusEl.className = 'gps-status';
    statusEl.textContent = '📡 GPS स्थान घेत आहे...';
    try {
      const position = await getCurrentPosition();
      gpsData = { latitude: position.latitude, longitude: position.longitude, address: '' };
      statusEl.className = 'gps-status ok';
      statusEl.textContent = `✅ ${position.latitude.toFixed(6)}, ${position.longitude.toFixed(6)} (अचूकता ~${Math.round(position.accuracy)}मी)`;

      const address = await reverseGeocode(position.latitude, position.longitude);
      if (address) {
        gpsData.address = address;
        statusEl.textContent += ' — ' + address;
      }
    } catch (error) {
      statusEl.className = 'gps-status err';
      statusEl.innerHTML = '';
      statusEl.textContent = '⚠️ ' + error.message + '  ';
      const retryBtn = document.createElement('button');
      retryBtn.type = 'button';
      retryBtn.textContent = 'पुन्हा प्रयत्न करा';
      retryBtn.style.cssText = 'text-decoration:underline;font-weight:700;background:none;border:none;color:inherit;cursor:pointer;';
      retryBtn.addEventListener('click', captureGps);
      statusEl.appendChild(retryBtn);
    }
  }

  async function onSubmit(e) {
    e.preventDefault();

    const district = document.getElementById('district').value;
    const busStation = document.getElementById('busStation').value;
    if (!district || !busStation) {
      Swal.fire({ icon: 'warning', title: 'जिल्हा आणि बस स्टेशन निवडा' });
      return;
    }
    if (!document.getElementById('visitDate').value) {
      Swal.fire({ icon: 'warning', title: 'भेट दिनांक निवडा' });
      return;
    }
    // GPS is optional — if it wasn't captured (denied, unavailable, or
    // still in progress), submission proceeds anyway with blank
    // latitude/longitude/address rather than blocking the officer.
    const unanswered = checklistQuestions.filter((q) => !isQuestionAnswered(q.questionId));
    if (unanswered.length > 0) {
      const allJustMissingRemark = unanswered.every((q) => currentAnswers[q.questionId] && currentAnswers[q.questionId].answer === 'नाही');
      const allJustMissingRating = unanswered.every((q) => currentAnswers[q.questionId] && currentAnswers[q.questionId].answer === 'होय' && isRatingQuestion(q.question) && !currentAnswers[q.questionId].rating);
      if (allJustMissingRemark) {
        Swal.fire({ icon: 'warning', title: 'शेरा आवश्यक आहे', text: `"नाही" दिलेल्या ${unanswered.length} प्रश्नांसाठी शेरा लिहा` });
      } else if (allJustMissingRating) {
        Swal.fire({ icon: 'warning', title: 'रेटिंग आवश्यक आहे', text: `${unanswered.length} प्रश्नांसाठी स्टार रेटिंग द्या` });
      } else {
        Swal.fire({ icon: 'warning', title: 'सर्व प्रश्नांची उत्तरे द्या', text: `${unanswered.length} प्रश्न बाकी आहेत` });
      }
      return;
    }

    const confirm = await Swal.fire({
      title: 'सबमिट करायचे आहे का?', icon: 'question', showCancelButton: true,
      confirmButtonText: 'सबमिट करा', cancelButtonText: 'रद्द करा'
    });
    if (!confirm.isConfirmed) return;

    setSubmitting(true);
    try {
      const responses = checklistQuestions.map((q) => {
        const a = currentAnswers[q.questionId] || {};
        // "इतर" is folded into the printed/stored option text as "इतर: <detail>"
        // so its free-text detail travels with the rest of the ticks — no
        // extra column needed.
        const difficultyOptions = (a.difficultyOptions || [])
          .map((opt) => (opt === DIFFICULTY_OTHER_LABEL && a.otherText ? (DIFFICULTY_OTHER_LABEL + ': ' + a.otherText) : opt))
          .join(', ');
        return {
          questionId: q.questionId, question: q.question, category: q.category,
          answer: a.answer || '',
          // remark (नाही reason) and yesNote (होय detail) are mutually
          // exclusive per question — both land in the same sheet column.
          remark: a.remark || a.yesNote || '',
          rating: a.rating || '',
          difficultyOptions: difficultyOptions
        };
      });

      const response = await submitVisit({
        district, busStation,
        visitDate: document.getElementById('visitDate').value,
        visitTime: document.getElementById('visitTime').value,
        latitude: gpsData ? gpsData.latitude : '',
        longitude: gpsData ? gpsData.longitude : '',
        gpsAddress: gpsData ? gpsData.address : '',
        overallRemark: document.getElementById('overallRemark').value
      }, responses);

      if (response.success) {
        showResultPanel(response);
      } else if (response.duplicate) {
        Swal.fire({ icon: 'warning', title: 'आधीच नोंदवले आहे', text: response.message });
      } else {
        Swal.fire({ icon: 'error', title: 'सबमिट अयशस्वी', text: response.message });
      }
    } catch (error) {
      Swal.fire({ icon: 'error', title: 'त्रुटी', text: error.message });
    } finally {
      setSubmitting(false);
    }
  }

  function setSubmitting(submitting) {
    document.getElementById('submitBtn').disabled = submitting;
    document.getElementById('submitBtnText').textContent = submitting ? 'सबमिट होत आहे...' : 'सबमिट करा';
  }

  function showResultPanel(response) {
    lastVisitId = response.visitId;
    document.getElementById('visitForm').classList.add('hidden-force');
    const panel = document.getElementById('resultPanel');
    panel.classList.remove('hidden-force');
    document.getElementById('resultVisitId').textContent = response.visitId;

    const downloadBtn = document.getElementById('downloadPdfBtn');
    const retryBtn = document.getElementById('retryPdfBtn');
    downloadBtn.classList.add('hidden-force');
    retryBtn.classList.add('hidden-force');
    document.getElementById('resultSubtext').textContent = '📄 PDF तयार होत आहे, कृपया थांबा...';
    panel.scrollIntoView({ behavior: 'smooth' });

    // Automatic — no button click needed. The visit is already saved by
    // this point; this just fetches the PDF that generates in the
    // background, so "submit" itself stays fast.
    generatePdfNow(response.visitId);
  }

  async function generatePdfNow(visitId) {
    const downloadBtn = document.getElementById('downloadPdfBtn');
    const retryBtn = document.getElementById('retryPdfBtn');
    const response = await regeneratePDF(visitId);

    if (response.success) {
      downloadBtn.href = response.pdfUrl;
      downloadBtn.classList.remove('hidden-force');
      retryBtn.classList.add('hidden-force');
      document.getElementById('resultSubtext').textContent = '✅ PDF तयार झाला आहे.';
    } else {
      downloadBtn.classList.add('hidden-force');
      retryBtn.classList.remove('hidden-force');
      retryBtn.disabled = false;
      retryBtn.textContent = '🔄 PDF पुन्हा तयार करा';
      document.getElementById('resultSubtext').textContent = 'PDF तयार करताना अडचण आली — पुन्हा प्रयत्न करा.';
    }
  }

  async function onRetryPdf() {
    const btn = document.getElementById('retryPdfBtn');
    btn.disabled = true; btn.textContent = 'तयार करत आहे...';
    document.getElementById('resultSubtext').textContent = '📄 PDF तयार होत आहे, कृपया थांबा...';
    await generatePdfNow(lastVisitId);
  }

  async function onUploadSigned() {
    const input = document.getElementById('signedFileInput');
    const statusEl = document.getElementById('uploadStatus');
    const file = input.files[0];
    if (!file) {
      statusEl.textContent = 'कृपया फाईल निवडा';
      statusEl.style.color = '#b91c1c';
      return;
    }
    const validationError = validateSignedChecklistFile(file);
    if (validationError) {
      statusEl.textContent = validationError;
      statusEl.style.color = '#b91c1c';
      return;
    }

    const btn = document.getElementById('uploadSignedBtn');
    btn.disabled = true;
    statusEl.textContent = 'अपलोड होत आहे...';
    statusEl.style.color = '#64748b';

    try {
      const base64 = await fileToBase64(file);
      const response = await uploadSignedChecklist(lastVisitId, base64, file.name, file.type);
      if (response.success) {
        statusEl.textContent = '✅ यशस्वीरित्या अपलोड झाले';
        statusEl.style.color = '#047857';
      } else {
        statusEl.textContent = '❌ ' + response.message;
        statusEl.style.color = '#b91c1c';
      }
    } catch (error) {
      statusEl.textContent = '❌ ' + error.message;
      statusEl.style.color = '#b91c1c';
    } finally {
      btn.disabled = false;
    }
  }

  function resetForNewVisit() {
    document.getElementById('resultPanel').classList.add('hidden-force');
    document.getElementById('visitForm').classList.remove('hidden-force');
    document.getElementById('visitForm').reset();
    currentAnswers = {};
    document.querySelectorAll('.yn-btn.active').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('#checklistContainer textarea').forEach((t) => t.classList.add('hidden-force'));
    document.querySelectorAll('.star-btn.filled').forEach((b) => b.classList.remove('filled'));
    document.querySelectorAll('.star-group').forEach((s) => s.classList.add('hidden-force'));
    document.querySelectorAll('.rating-hint').forEach((h) => { h.textContent = 'रेटिंग द्या (आवश्यक)'; h.classList.add('required', 'hidden-force'); });
    document.querySelectorAll('.check-group input[type="checkbox"]').forEach((cb) => { cb.checked = false; });
    document.getElementById('busStation').innerHTML = '<option value="">आधी जिल्हा निवडा</option>';
    document.getElementById('busStation').disabled = true;
    document.getElementById('visitDate').value = formatDateTime(new Date());

    updateProgress();
    captureGps();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
